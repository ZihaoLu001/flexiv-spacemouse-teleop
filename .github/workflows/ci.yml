name: ci

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Python syntax
        run: python -m py_compile flexiv_spacemouse_teleop/*.py scripts/*.py tests/*.py
      - name: Shell syntax
        run: bash -n scripts/*.sh

  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - uses: ros-tooling/action-ros-ci@v0.3
        with:
          package-name: flexiv_spacemouse_teleop
          target-ros2-distro: humble
